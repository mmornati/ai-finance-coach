# Dependency updates (one pull request per ecosystem and week; CI must stay green before a bump is merged).
version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      python-minor-and-patch:
        update-types: ["minor", "patch"]
  - package-ecosystem: "npm"
    directory: "/web"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      web-minor-and-patch:
        update-types: ["minor", "patch"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    ignore:
      # sqlcipher3-wheels has no cp315 wheel yet (0.5.7 stops at cp314) and its sdist needs a compiler and Conan:
      # move the base image to 3.15 by hand once a release ships cp315 wheels (patch and digest updates still come).
      - dependency-name: "python"
        versions: [">=3.15"]
