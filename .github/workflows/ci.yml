name: CI

# Not executed by the project's own checks (no runner here); `tests/test_packaging.py` parses it and checks what it must run.
# Actions are pinned to a commit SHA (the tag is in the trailing comment); Dependabot (.github/dependabot.yml) proposes the bumps.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: pytest and lint (Python ${{ matrix.python }}, shard ${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.13"]          # the version the suite is run on; add "3.11" / "3.12" here once someone has run them (pyproject says >=3.11)
        shard: [1, 2, 3]          # the suite is split round robin over 3 jobs (`--shard K/3`, tests/conftest.py); change the 3 in the steps too
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Install
        run: uv sync --python ${{ matrix.python }}
      - name: Lint (ruff)
        if: matrix.shard == 1
        run: uv run ruff check src tests
      - name: Tests (pytest, shard ${{ matrix.shard }}/3, one xdist worker per CPU)
        run: uv run pytest -q -n auto --shard ${{ matrix.shard }}/3 --api-calls-out api-calls-${{ matrix.shard }}.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: api-calls-${{ matrix.python }}-${{ matrix.shard }}
          path: api-calls-${{ matrix.shard }}.json
          if-no-files-found: error

  web:
    name: vitest, type check and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Type check
        run: pnpm typecheck
      - name: Tests (vitest)
        run: pnpm test
      - name: Build
        run: pnpm build
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: web-build
          path: src/coach/api/static
          if-no-files-found: error

  release-check:
    name: release-check
    runs-on: ubuntu-latest
    needs: [python, web]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: uv sync
      - run: pnpm install --frozen-lockfile
        working-directory: web
      - run: pnpm build
        working-directory: web
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: api-calls-3.13-*
          path: ${{ runner.temp }}/api-calls
          merge-multiple: true
      - name: API endpoint coverage (the union of the pytest shards)
        run: uv run python tests/check_api_coverage.py "$RUNNER_TEMP"/api-calls/*.json
      # The test suites already ran in the `python` and `web` jobs this one needs: running them again here doubled the wall time.
      - name: "Release check (--ci: the real-data rule needs the owner's LOCAL term file and is reported as skipped here; the suites ran in the jobs above)"
        run: uv run coach dev release-check --ci --skip-tests --skip-web
