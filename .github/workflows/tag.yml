name: Tag a release

# Run by hand (Actions > "Tag a release" > Run workflow, on main). It tags the HEAD of main as v<version of pyproject.toml>, then calls release.yml.
#
# The version is NOT bumped here: main takes pull requests only (repository ruleset, no bypass), so the bump (`pyproject.toml`, `src/coach/__init__.py`,
# `uv lock`, the dated `## [x.y.z] - YYYY-MM-DD` section of CHANGELOG.md) is a normal pull request, merged on green CI (docs/release.md, step 2).
# The release-grade check needs the owner's LOCAL term file (step 5): CI can only run it with --ci, so the dispatch asks the owner to confirm it.
#
# Why release.yml is called (`uses:`) rather than left to its `push: tags` trigger: a tag pushed with the GITHUB_TOKEN starts NO other workflow
# (GitHub's loop guard). A tag pushed by hand (`git push origin v0.3.0`) goes through release.yml's own trigger.
on:
  workflow_dispatch:
    inputs:
      local_release_check:
        description: "I ran `uv run coach dev release-check` (no --ci, no skips) on this commit and it printed READY"
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  tag:
    # A release is always tagged on main, never on a work branch.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write   # push the tag
      checks: read      # read the CI result of the commit
    outputs:
      tag: ${{ steps.next.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # every tag

      - name: Version, changelog and tag
        id: next
        env:
          CONFIRMED: ${{ inputs.local_release_check }}
        run: |
          set -euo pipefail
          if [ "$CONFIRMED" != "true" ]; then
            echo "::error::Run the full release check locally first (docs/release.md, step 5), then tick the box."
            exit 1
          fi
          version=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          tag="v$version"
          # PEP 440: 0.3.0, or a pre-release 0.3.0a1 / 0.3.0b1 / 0.3.0rc1 (the version the wheel carries, so no SemVer "-rc.1" here).
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+((a|b|rc)[0-9]+)?$ ]]; then
            echo "::error::pyproject.toml version \"$version\" is not X.Y.Z or X.Y.Z(a|b|rc)N"
            exit 1
          fi
          if ! grep -qx "__version__ = \"$version\"" src/coach/__init__.py; then
            echo "::error::src/coach/__init__.py does not carry $version"
            exit 1
          fi
          first=$(grep -m1 -E '^## \[[0-9]' CHANGELOG.md || true)
          if ! [[ "$first" =~ ^"## [$version] - "[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
            echo "::error::The first dated section of CHANGELOG.md is \"$first\", expected \"## [$version] - YYYY-MM-DD\""
            exit 1
          fi
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "::error::The tag $tag already exists: bump the version in a pull request first"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      # The tag goes on a commit whose CI passed, never on one still running or red.
      - name: CI is green on this commit
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          sha=$(git rev-parse HEAD)
          runs=$(gh api "repos/$GH_REPO/commits/$sha/check-runs?per_page=100" --jq '.check_runs[] | "\(.name)\t\(.status)\t\(.conclusion)"')
          missing=0
          for name in "pytest and lint (Python 3.14, shard 1/3)" "pytest and lint (Python 3.14, shard 2/3)" \
                      "pytest and lint (Python 3.14, shard 3/3)" "vitest, type check and build" "release-check"; do
            if ! grep -qxF "$name"$'\tcompleted\tsuccess' <<< "$runs"; then
              echo "::error::CI check \"$name\" is not completed and green on $sha (still running? wait for it and run again)"
              missing=1
            fi
          done
          exit $missing

      - name: Create and push the tag
        env:
          TAG: ${{ steps.next.outputs.tag }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "refs/tags/$TAG"
          echo "### Tag \`$TAG\` pushed on \`$(git rev-parse --short HEAD)\`" >> "$GITHUB_STEP_SUMMARY"

  release:
    needs: tag
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.tag.outputs.tag }}
