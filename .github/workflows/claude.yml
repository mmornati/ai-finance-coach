name: Claude Code

# `@claude` on demand in issues and pull requests (comments, reviews, issue body or title).
# Only the owner, members and collaborators can trigger it: the action rejects anyone without write access.
# Actions are pinned to a commit SHA (the tag is in the trailing comment); Dependabot proposes the bumps.
#
# `@claude` can be tagged on a fork pull request, whose text and files are untrusted and end up in the prompt:
# read the raw PR first. CLAUDE_CODE_SUBPROCESS_ENV_SCRUB strips the Anthropic and GitHub credentials from every
# subprocess Claude starts, which makes an injected instruction less able to read the token (it reduces the risk,
# it does not remove it).
#
# Requires the ANTHROPIC_API_KEY repository secret (a Claude Console key, billed on API credits) and the Claude GitHub App.

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

permissions:
  contents: read

jobs:
  claude:
    if: |
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association || github.event.review.author_association || github.event.issue.author_association) &&
      ((github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude'))))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
      actions: read  # lets Claude read the CI results of a pull request
    env:
      CLAUDE_CODE_SUBPROCESS_ENV_SCRUB: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      # The env scrub needs bubblewrap (the Claude Code install aborts without it); Ubuntu 24.04 blocks the unprivileged
      # user namespaces it uses through AppArmor. The Bash sandbox also needs socat, otherwise Claude falls back to read-only.
      - name: Install bubblewrap and socat
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bubblewrap socat
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true

      - name: Run Claude Code
        uses: anthropics/claude-code-action@4411a9e9b0283becf4b924f7bce360fd7756c78c # v1.0.290
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          additional_permissions: |
            actions: read
